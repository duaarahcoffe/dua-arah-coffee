<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dua Arah Coffee - GoFood Style</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#FAF6F0;
}

/* HEADER */
header{
    background:#4A3525;
    color:white;
    padding:20px;
    text-align:center;
}

/* CONTAINER */
.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

/* MENU */
.menu{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    text-align:center;
}

.card img{
    width:100%;
    height:150px;
    object-fit:cover;
    border-radius:10px;
}

.price{
    color:#8C6A50;
    font-weight:bold;
}

.btn{
    background:#4A3525;
    color:white;
    border:none;
    padding:8px 12px;
    margin:5px;
    cursor:pointer;
    border-radius:5px;
}

/* CART */
.cart{
    position:fixed;
    right:20px;
    bottom:20px;
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 5px 20px rgba(0,0,0,0.2);
    width:250px;
}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    justify-content:center;
    align-items:center;
}

.box{
    background:white;
    padding:20px;
    border-radius:10px;
    width:300px;
    text-align:center;
}

input,textarea,select{
    width:100%;
    padding:10px;
    margin-top:10px;
    border-radius:6px;
    border:1px solid #ccc;
}

img{
    width:100%;
    border-radius:10px;
}
</style>
</head>

<body>

<header>
    <h1>Dua Arah Coffee</h1>
    <p>Mini GoFood System</p>
</header>

<div class="container">

    <div class="menu">

        <div class="card">
            <img src="americano.jpg">
            <h3>Americano</h3>
            <p class="price">Rp 12.500</p>
            <button class="btn" onclick="add('Americano',12500)">+</button>
            <button class="btn" onclick="removeItem('Americano')">-</button>
        </div>

        <div class="card">
            <img src="aren.jpg">
            <h3>Kopi Aren</h3>
            <p class="price">Rp 17.500</p>
            <button class="btn" onclick="add('Kopi Aren',17500)">+</button>
            <button class="btn" onclick="removeItem('Kopi Aren')">-</button>
        </div>

    </div>

</div>

<!-- CART -->
<div class="cart">
    <h3>Keranjang</h3>
    <div id="cartList">Kosong</div>
    <h4>Total: Rp <span id="total">0</span></h4>
    <button class="btn" onclick="openCheckout()">Checkout</button>
</div>

<!-- CHECKOUT -->
<div class="modal" id="checkout">
    <div class="box">

        <h3>Checkout</h3>

        <input id="nama" placeholder="Nama">
        <textarea id="alamat" placeholder="Alamat"></textarea>

        <select id="payment">
            <option value="qris">QRIS</option>
            <option value="bca">Transfer BCA</option>
            <option value="cash">Cash</option>
        </select>

        <button class="btn" onclick="pay()">Bayar</button>
        <button class="btn" onclick="closeCheckout()">Tutup</button>

    </div>
</div>

<!-- PAYMENT -->
<div class="modal" id="paymentPage">
    <div class="box">

        <h3>Pembayaran</h3>
        <div id="payContent"></div>

        <button class="btn" onclick="finish()">Selesai</button>

    </div>
</div>

<script>

let cart = [];

function add(name,price){

    let item = cart.find(i=>i.name===name);

    if(item){
        item.qty++;
    }else{
        cart.push({name,price,qty:1});
    }

    updateCart();
}

function removeItem(name){

    let item = cart.find(i=>i.name===name);

    if(item){
        item.qty--;
        if(item.qty<=0){
            cart = cart.filter(i=>i.name!==name);
        }
    }

    updateCart();
}

function updateCart(){

    let html="";
    let total=0;

    if(cart.length===0){
        html="Kosong";
    }else{
        cart.forEach(i=>{
            html+=`${i.name} x ${i.qty}<br>`;
            total+=i.price*i.qty;
        });
    }

    document.getElementById('cartList').innerHTML=html;
    document.getElementById('total').innerText=total;
}

function openCheckout(){
    document.getElementById('checkout').style.display="flex";
}

function closeCheckout(){
    document.getElementById('checkout').style.display="none";
}

function pay(){

    let metode=document.getElementById('payment').value;

    document.getElementById('checkout').style.display="none";
    document.getElementById('paymentPage').style.display="flex";

    let content="";

    if(metode==="qris"){
        content=`<img src="qris.jpg"><p>Scan QRIS untuk bayar</p>`;
    }

    if(metode==="bca"){
        content=`<img src="bca.jpg"><p>No Rek: 088210129982</p>`;
    }

    if(metode==="cash"){
        content=`<p>Bayar saat pesanan datang</p>`;
    }

    document.getElementById('payContent').innerHTML=content;
}

function finish(){
    cart=[];
    updateCart();
    document.getElementById('paymentPage').style.display="none";
}

</script>

</body>
</html>
