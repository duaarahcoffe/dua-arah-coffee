<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dua Arah Coffee</title>

    <style>
        :root {
            --primary: #4A3525;
            --accent: #8C6A50;
            --bg: #FAF6F0;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg);
        }

        /* Banner Paling Atas */
        .top-banner {
            width: 100%;
            display: block;
        }

        .top-banner img {
            width: 100%;
            height: auto;
            display: block;
            max-height: 450px; /* Batas tinggi maksimal di desktop agar proporsional */
            object-fit: cover;
        }

        header {
            background: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        /* MENU */
        .menu-card {
            display: flex;
            gap: 15px;
            align-items: center;
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .menu-card img {
            width: 70px;
            height: 70px;
            border-radius: 10px;
            object-fit: cover;
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-left: auto; /* Mendorong tombol ke kanan */
        }

        /* CART */
        .cart {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* INPUT */
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            max-width: 300px;
            width: 90%;
        }

        .modal img {
            width: 100%;
            border-radius: 10px;
        }

        .close {
            color: red;
            cursor: pointer;
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }

        .checkout {
            width: 100%;
            padding: 12px;
            background: green;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="top-banner">
        <img src="1000585015.png" alt="Dua Arah Coffee Banner">
    </div>

    <header>
        <h2>☕ Dua Arah Coffee</h2>
    </header>

    <div class="container">

        <h3>Menu</h3>

        <div class="menu-card">
            <img src="americano.jpg" alt="Americano">
            <div>
                <b>Americano</b><br>Rp 12.500
            </div>
            <button class="btn" onclick="add('Americano', 12500)">+</button>
        </div>

        <div class="menu-card">
            <img src="aren.jpg" alt="Kopi Aren">
            <div>
                <b>Kopi Aren</b><br>Rp 17.500
            </div>
            <button class="btn" onclick="add('Kopi Aren', 17500)">+</button>
        </div>

        <h3>Keranjang</h3>
        <div class="cart" id="cart">Kosong</div>

        <h3>Data Pemesan</h3>
        <input id="nama" placeholder="Nama Lengkap">
        <input id="alamat" placeholder="Alamat Pengiriman">

        <h3>Pembayaran</h3>
        <select id="payment" onchange="cekBayar()">
            <option value="cash">Cash</option>
            <option value="qris">QRIS</option>
            <option value="bca">Transfer BCA</option>
        </select>

        <button class="checkout" onclick="checkout()">Checkout WhatsApp</button>

    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h3 id="title"></h3>
            <img id="img" alt="Payment Method">
            <span class="close" onclick="closeModal()">Tutup</span>
        </div>
    </div>

    <script>
        let cart = [];

        function add(name, price) {
            cart.push({name, price});
            render();
        }

        function render() {
            let html = "";
            let total = 0;

            if (cart.length === 0) {
                document.getElementById("cart").innerHTML = "Kosong";
                return;
            }

            cart.forEach((item) => {
                html += `${item.name} - Rp ${item.price.toLocaleString('id-ID')}<br>`;
                total += item.price;
            });

            html += `<hr><b>Total: Rp ${total.toLocaleString('id-ID')}</b>`;
            document.getElementById("cart").innerHTML = html;
        }

        function cekBayar() {
            let val = document.getElementById("payment").value;

            if (val === "qris") {
                openModal("QRIS Payment", "qris.jpg");
            }
            if (val === "bca") {
                openModal("Transfer BCA", "bca.jpg");
            }
        }

        function openModal(title, img) {
            document.getElementById("title").innerText = title;
            document.getElementById("img").src = img;
            document.getElementById("modal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("modal").style.display = "none";
        }

        function checkout() {
            let nama = document.getElementById("nama").value;
            let alamat = document.getElementById("alamat").value;
            let pay = document.getElementById("payment").value;

            if (cart.length === 0) {
                alert("Keranjang kosong!");
                return;
            }

            if (!nama || !alamat) {
                alert("Mohon isi nama dan alamat terlebih dahulu!");
                return;
            }

            let text = "Halo Dua Arah Coffee,%0A%0APesanan:%0A";

            cart.forEach(i => {
                text += `- ${i.name}%0A`;
            });

            text += `%0ANama: ${nama}%0AAlamat: ${alamat}%0APembayaran: ${pay.toUpperCase()}`;

            window.open("https://wa.me/6288210129982?text=" + text);
        }
    </script>

</body>
</html>
