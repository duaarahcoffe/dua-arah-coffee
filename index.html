<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dua Arah Coffee</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

        :root {
            --primary: #2C1E14;
            --accent: #A07855;
            --bg: #FDFBF9;
            --text-dark: #3D2A1D;
            --text-muted: #705A49;
            --card-bg: #ffffff;
            --border-color: #EFEAE4;
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text-dark);
            -webkit-font-smoothing: antialiased;
        }

        .top-banner {
            position: relative;
            width: 100%;
            max-height: 400px;
            overflow: hidden;
        }

        .top-banner img {
            width: 100%;
            height: auto;
            max-height: 400px;
            display: block;
            object-fit: cover;
        }

        .top-banner::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(to top, rgba(44, 30, 20, 0.4), rgba(0,0,0,0));
            pointer-events: none;
        }

        .container {
            max-width: 650px;
            margin: auto;
            padding: 0 20px 40px 20px;
        }

        .promo-section {
            position: relative;
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 30px 24px;
            margin: -50px 0 35px 0;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(44, 30, 20, 0.06);
            text-align: center;
            z-index: 10;
        }

        .promo-tagline {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .promo-desc {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.7;
            margin: 0;
        }

        .promo-highlight {
            font-weight: 600;
            color: var(--accent);
            background: #FAF3EC;
            padding: 2px 8px;
            border-radius: 4px;
        }

        h3 {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            margin: 35px 0 15px 0;
        }

        .menu-card {
            display: flex;
            flex-direction: column;
            background: var(--card-bg);
            margin-bottom: 20px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 12px rgba(44, 30, 20, 0.02);
            overflow: hidden;
        }

        .menu-card .product-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .menu-details { padding: 16px; }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
        }

        .cart {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border-radius: 8px;
            border: 1px solid #DCD5CE;
        }

        .checkout {
            width: 100%;
            padding: 14px;
            background: #25D366;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 700;
        }

    </style>
</head>
<body>

<div class="top-banner">
    <img src="1000585015.png" alt="">
</div>

<div class="container">

    <div class="promo-section">
        <div class="promo-tagline">"Dua arah, banyak tujuan. Berbagi cerita, satu rasa."</div>
        <p class="promo-desc">
            Setiap orang punya cerita dan tujuannya masing-masing.
        </p>
    </div>

    <h3>Menu</h3>

    <div class="menu-card">
        <img class="product-img" src="americano.jpg">
        <div class="menu-details">
            <b>Americano</b>
            <button class="btn" onclick="add('Americano',12500)">Tambah</button>
        </div>
    </div>

    <h3>Keranjang</h3>
    <div class="cart" id="cart">Kosong</div>

    <h3>Data Pemesan</h3>
    <input id="nama" placeholder="Nama">
    <input id="alamat" placeholder="Alamat">

    <h3>Pembayaran</h3>
    <select id="payment">
        <option value="cash">Cash</option>
        <option value="qris">QRIS</option>
        <option value="bca">BCA</option>
    </select>

    <h3>Catatan</h3>
    <textarea id="catatan"></textarea>

    <button class="checkout" onclick="checkout()">Kirim ke WhatsApp</button>

</div>

<script>
let cart = [];

function add(name, price){
    let item = cart.find(i => i.name === name);
    if(item) item.qty++;
    else cart.push({name, price, qty:1});
    render();
}

function render(){
    let html = "";
    cart.forEach(i=>{
        html += `<div>${i.name} x${i.qty}</div>`;
    });
    document.getElementById("cart").innerHTML = cart.length ? html : "Kosong";
}

function checkout(){
    let nama = document.getElementById("nama").value;
    let alamat = document.getElementById("alamat").value;
    let pay = document.getElementById("payment").value;
    let catatan = document.getElementById("catatan").value;

    let text = "Halo Dua Arah Coffee,%0APesanan:%0A";

    cart.forEach(i=>{
        text += `- ${i.name} x${i.qty}%0A`;
    });

    text += `%0ANama: ${nama}`;
    text += `%0AAlamat: ${alamat}`;
    text += `%0APembayaran: ${pay.toUpperCase()}`;

    // 🔔 TAMBAHAN PENGINGAT QRIS / BCA
    if(pay === "qris" || pay === "bca"){
        text += `%0A%0A⚠️ PENTING: Setelah transfer QRIS/BCA, wajib kirim bukti pembayaran ke chat ini.`;
    }

    if(catatan){
        text += `%0ACatatan: ${catatan}`;
    }

    window.open("https://wa.me/6288210129982?text=" + text);
}
</script>

</body>
</html>
