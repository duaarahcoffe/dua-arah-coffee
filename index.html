<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dua Arah Coffee</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

:root {
    --primary: #2C1E14;
    --accent: #A07855;
    --bg: #FDFBF9;
    --text-muted: #705A49;
}

body {
    margin: 0;
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg);
    color: var(--primary);
}

.top-banner img {
    width: 100%;
    max-height: 300px;
    object-fit: cover;
}

.container {
    max-width: 650px;
    margin: auto;
    padding: 20px;
}

/* PROMO */
.promo-section {
    background: white;
    padding: 20px;
    border-radius: 14px;
    margin-top: -40px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    text-align: center;
}

/* MENU */
.menu-card {
    background: white;
    margin: 15px 0;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 5px 15px rgba(0,0,0,0.05);
}

.menu-card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
}

.menu-body {
    padding: 15px;
}

.btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
}

/* CART */
.cart {
    background: white;
    padding: 15px;
    border-radius: 12px;
    margin-top: 20px;
}

input, select, textarea {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 8px;
    border: 1px solid #ddd;
}

.checkout {
    width: 100%;
    padding: 14px;
    background: #25D366;
    color: white;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="top-banner">
    <img src="1000585015.png" alt="banner">
</div>

<div class="container">

<div class="promo-section">
    <h3>Dua arah, banyak tujuan</h3>
    <p>Berbagi cerita, satu rasa.</p>
</div>

<h3>Menu</h3>

<div class="menu-card">
    <img src="americano.jpg">
    <div class="menu-body">
        <h4>Americano</h4>
        <p>Rp 12.500</p>
        <button class="btn" onclick="add('Americano',12500)">Tambah</button>
    </div>
</div>

<div class="menu-card">
    <img src="aren.jpg">
    <div class="menu-body">
        <h4>Kopi Aren</h4>
        <p>Rp 17.500</p>
        <button class="btn" onclick="add('Kopi Aren',17500)">Tambah</button>
    </div>
</div>

<h3>Keranjang</h3>
<div class="cart" id="cart">Kosong</div>

<h3>Data Pemesan</h3>
<input id="nama" placeholder="Nama">
<input id="alamat" placeholder="Alamat">

<h3>Pembayaran</h3>
<select id="payment">
    <option value="cash">Cash</option>
    <option value="qris">QRIS</option>
    <option value="bca">Transfer BCA</option>
</select>

<button class="checkout" onclick="checkout()">
    Checkout WhatsApp
</button>

</div>

<script>
let cart = [];

function add(name, price){
    let item = cart.find(i => i.name === name);
    if(item) item.qty++;
    else cart.push({name, price, qty:1});
    render();
}

function minus(name){
    let item = cart.find(i => i.name === name);
    if(!item) return;
    item.qty--;
    if(item.qty <= 0){
        cart = cart.filter(i => i.name !== name);
    }
    render();
}

function render(){
    if(cart.length === 0){
        document.getElementById("cart").innerHTML = "Kosong";
        return;
    }

    let html = "";
    let total = 0;

    cart.forEach(i => {
        total += i.price * i.qty;

        html += `
        <div>
            <b>${i.name}</b><br>
            Rp ${i.price} x ${i.qty}
            <button onclick="minus('${i.name}')">-</button>
            <button onclick="add('${i.name}',${i.price})">+</button>
        </div>
        <hr>
        `;
    });

    html += `<h4>Total: Rp ${total}</h4>`;
    document.getElementById("cart").innerHTML = html;
}

function checkout(){
    let nama = document.getElementById("nama").value;
    let alamat = document.getElementById("alamat").value;
    let pay = document.getElementById("payment").value;

    if(cart.length === 0){
        alert("Keranjang kosong!");
        return;
    }

    if(!nama || !alamat){
        alert("Isi data dulu!");
        return;
    }

    let text = "Halo Dua Arah Coffee,%0A%0APesanan:%0A";

    cart.forEach(i => {
        text += `- ${i.name} x${i.qty}%0A`;
    });

    text += `%0ANama: ${nama}`;
    text += `%0AAlamat: ${alamat}`;
    text += `%0APembayaran: ${pay}`;

    window.open("https://wa.me/6288210129982?text=" + text);
}
</script>

</body>
</html>
