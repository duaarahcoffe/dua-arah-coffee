<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dua Arah Coffee</title>

<style>
:root{
    --primary:#4A3525;
    --accent:#8C6A50;
    --bg:#FAF6F0;
}

body{
    margin:0;
    font-family:Arial;
    background:var(--bg);
}

/* HEADER BARU */
header{
    position:relative;
    height:220px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    text-align:center;
    overflow:hidden;
}

/* background kopi */
header::before{
    content:"";
    position:absolute;
    inset:0;
    background:url("coffee-bg.jpg") center/cover;
    filter:brightness(0.4);
}

header h1{
    position:relative;
    font-size:34px;
    z-index:1;
}

/* container */
.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

/* menu */
.menu-card{
    display:flex;
    align-items:center;
    gap:10px;
    background:white;
    padding:10px;
    margin-bottom:10px;
    border-radius:10px;
}

.menu-card img{
    width:60px;
    height:60px;
    border-radius:10px;
}

.btn{
    margin-left:auto;
    background:var(--accent);
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
}

/* CART SIDEBAR */
.cart-btn{
    position:fixed;
    right:20px;
    bottom:20px;
    background:var(--primary);
    color:white;
    border:none;
    width:60px;
    height:60px;
    border-radius:50%;
    font-size:24px;
    cursor:pointer;
}

.sidebar{
    position:fixed;
    top:0;
    right:-350px;
    width:320px;
    height:100%;
    background:white;
    box-shadow:-5px 0 20px rgba(0,0,0,0.2);
    padding:20px;
    transition:0.3s;
}

.sidebar.active{
    right:0;
}

.close{
    cursor:pointer;
    color:red;
    font-weight:bold;
}

/* input */
input,select{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:10px;
    border-radius:8px;
    border:1px solid #ccc;
}

/* modal */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    justify-content:center;
    align-items:center;
}

.modal-content{
    background:white;
    padding:20px;
    border-radius:10px;
}
</style>
</head>

<body>

<header>
    <h1>Dua Arah Coffee ☕</h1>
</header>

<div class="container">

<h3>Menu</h3>

<div class="menu-card">
    <img src="americano.jpg">
    <div>Americano<br>Rp 12.500</div>
    <button class="btn" onclick="add('Americano',12500)">+</button>
</div>

<div class="menu-card">
    <img src="aren.jpg">
    <div>Kopi Aren<br>Rp 17.500</div>
    <button class="btn" onclick="add('Kopi Aren',17500)">+</button>
</div>

<h3>Data</h3>
<input id="nama" placeholder="Nama">
<input id="alamat" placeholder="Alamat">

<select id="payment" onchange="cekBayar()">
    <option value="cash">Cash</option>
    <option value="qris">QRIS</option>
    <option value="bca">BCA Transfer</option>
</select>

<button onclick="checkout()" style="padding:10px;width:100%;background:green;color:white;border:none;">
Checkout
</button>

</div>

<!-- CART SIDEBAR -->
<button class="cart-btn" onclick="toggleCart()">🛒</button>

<div class="sidebar" id="sidebar">

<span class="close" onclick="toggleCart()">✖</span>

<h3>Keranjang</h3>
<div id="cart">Kosong</div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
    <div class="modal-content">
        <h3 id="title"></h3>
        <img id="img" style="width:100%;">
        <br><br>
        <button onclick="closeModal()">Tutup</button>
    </div>
</div>

<script>

let cart=[];

function add(name,price){
    cart.push({name,price});
    render();
}

function render(){
    let html="";
    let total=0;

    if(cart.length==0){
        document.getElementById("cart").innerHTML="Kosong";
        return;
    }

    cart.forEach(i=>{
        html+=`${i.name} - Rp ${i.price.toLocaleString('id-ID')}<br>`;
        total+=i.price;
    });

    html+=`<hr><b>Total: Rp ${total.toLocaleString('id-ID')}</b>`;
    document.getElementById("cart").innerHTML=html;
}

function toggleCart(){
    document.getElementById("sidebar").classList.toggle("active");
}

function cekBayar(){
    let val=document.getElementById("payment").value;

    if(val=="qris"){
        openModal("QRIS", "qris.jpg");
    }
    if(val=="bca"){
        openModal("BCA", "bca.jpg");
    }
}

function openModal(t,img){
    document.getElementById("title").innerText=t;
    document.getElementById("img").src=img;
    document.getElementById("modal").style.display="flex";
}

function closeModal(){
    document.getElementById("modal").style.display="none";
}

function checkout(){

    let nama=document.getElementById("nama").value;
    let alamat=document.getElementById("alamat").value;
    let pay=document.getElementById("payment").value;

    if(cart.length==0){
        alert("Keranjang kosong");
        return;
    }

    let text="Halo Coffee,%0A%0A";

    cart.forEach(i=>{
        text+=`- ${i.name}%0A`;
    });

    text+=`%0ANama: ${nama}%0AAlamat: ${alamat}%0APembayaran: ${pay}`;

    window.open("https://wa.me/6288210129982?text="+text);
}

</script>

</body>
</html>
