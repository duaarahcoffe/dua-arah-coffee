<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Level 3 - App System</title>

<style>
body{font-family:Arial;margin:0;background:#FAF6F0;}
header{background:#4A3525;color:white;text-align:center;padding:20px;}
.container{padding:20px;}
.box{background:white;padding:10px;margin-bottom:10px;border-radius:10px;}
button{background:#4A3525;color:white;border:none;padding:8px;border-radius:5px;}
</style>
</head>

<body>

<header>
<h2>Level 3 - App System + Admin</h2>
</header>

<div class="container">

<h3>Tambah Order</h3>

<input id="nama" placeholder="Nama"><br><br>
<textarea id="order" placeholder="Pesanan"></textarea><br><br>

<button onclick="save()">Simpan Order</button>

<h3>📦 Semua Order</h3>
<div id="list"></div>

</div>

<script>

function save(){

let data={
nama:document.getElementById('nama').value,
order:document.getElementById('order').value,
time:new Date().toLocaleString()
};

let db=JSON.parse(localStorage.getItem("orders")||"[]");
db.push(data);
localStorage.setItem("orders",JSON.stringify(db));

show();
}

function show(){

let db=JSON.parse(localStorage.getItem("orders")||"[]");

let html="";

db.forEach(d=>{
html+=`
<div class='box'>
<b>${d.nama}</b><br>
${d.order}<br>
<small>${d.time}</small>
</div>
`;
});

document.getElementById("list").innerHTML=html;
}

show();

</script>

</body>
</html>
