<script>

let cart = [];

function add(name, price) {
    cart.push({
        name,
        price,
        note: ""
    });
    render();
}

function render() {
    let html = "";
    let total = 0;

    if (cart.length === 0) {
        document.getElementById("cart").innerHTML = "Kosong";
        return;
    }

    cart.forEach((i, index) => {

        total += i.price;

        html += `
        <div style="margin-bottom:10px;">
            <b>${i.name}</b><br>
            Rp ${i.price.toLocaleString('id-ID')}<br>

            <input 
                placeholder="Extra shot / catatan"
                value="${i.note}"
                onchange="updateNote(${index}, this.value)"
                style="width:100%;padding:5px;margin-top:5px"
            >

        </div>
        <hr>
        `;
    });

    html += `<b>Total: Rp ${total.toLocaleString('id-ID')}</b>`;

    document.getElementById("cart").innerHTML = html;
}

function updateNote(index, value) {
    cart[index].note = value;
}

function toggleCart() {
    document.getElementById("sidebar").classList.toggle("active");
}

function paymentCheck() {
    let val = document.getElementById("payment").value;

    if (val === "qris") {
        openModal("QRIS Payment", "qris.jpg");
    }

    if (val === "bca") {
        openModal("Transfer BCA", "bca.jpg");
    }
}

function openModal(title, img) {
    document.getElementById("title").innerText = title;
    document.getElementById("img").src = img;
    document.getElementById("modal").style.display = "flex";
}

function closeModal() {
    document.getElementById("modal").style.display = "none";
}

function checkout() {

    let nama = document.getElementById("nama").value;
    let alamat = document.getElementById("alamat").value;

    if (cart.length === 0) {
        alert("Keranjang kosong");
        return;
    }

    if (!nama || !alamat) {
        alert("Isi data lengkap");
        return;
    }

    let text = "Halo Dua Arah Coffee,%0A%0A";

    cart.forEach(i => {
        text += `- ${i.name}`;
        if (i.note) {
            text += ` (Catatan: ${i.note})`;
        }
        text += `%0A`;
    });

    text += `%0ANama: ${nama}%0AAlamat: ${alamat}`;

    window.open("https://wa.me/6288210129982?text=" + text);
}

</script>
