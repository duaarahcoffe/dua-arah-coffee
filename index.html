<script>

let cart = [];

// API KEY IMGBB
const imgbbAPI = "55da03a5507a0848d566ad75ffe4b421";

function add(name, price) {

    let item = cart.find(i => i.name === name);

    if(item){
        item.qty += 1;
    }else{
        cart.push({
            name,
            price,
            qty: 1
        });
    }

    render();
}

function minus(name){

    let item = cart.find(i => i.name === name);

    if(!item) return;

    item.qty -= 1;

    if(item.qty <= 0){
        cart = cart.filter(i => i.name !== name);
    }

    render();
}

function render() {

    let html = "";
    let total = 0;

    if (cart.length === 0) {
        document.getElementById("cart").innerHTML = "Kosong";
        return;
    }

    cart.forEach((item) => {

        let subtotal = item.price * item.qty;
        total += subtotal;

        html += `
        <div style="margin-bottom:15px; display:flex; justify-content:space-between; align-items:center;">
            <div>
                <b style="color:var(--primary);">${item.name}</b><br>
                <span style="font-size:13px; color:var(--text-muted)">
                    Rp ${item.price.toLocaleString('id-ID')} x ${item.qty}
                </span>
            </div>

            <div>
                <button class="qty-btn minus" onclick="minus('${item.name}')">
                    ➖
                </button>

                <button class="qty-btn plus" onclick="add('${item.name}', ${item.price})">
                    ➕
                </button>
            </div>
        </div>

        <hr style="border:0; border-top:1px solid #EFEAE4; margin:10px 0;">
        `;
    });

    html += `
    <h4 style="margin:15px 0 0 0; text-align:right; font-size:16px; color:var(--primary);">
        Total: Rp ${total.toLocaleString('id-ID')}
    </h4>`;

    document.getElementById("cart").innerHTML = html;
}

function cekBayar() {

    let val = document.getElementById("payment").value;
    let buktiWrapper = document.getElementById("bukti-wrapper");

    if (val === "qris") {

        buktiWrapper.style.display = "block";
        openModal("QRIS Payment", "qris.jpg");

    } else if (val === "bca") {

        buktiWrapper.style.display = "block";
        openModal("Transfer BCA", "bca.jpg");

    } else {

        buktiWrapper.style.display = "none";
        document.getElementById("bukti_bayar").value = "";
    }
}

function openModal(title, img) {

    document.getElementById("title").innerText = title;
    document.getElementById("img").src = img;
    document.getElementById("modal").style.display = "flex";
}

function closeModal() {

    document.getElementById("modal").style.display = "none";
}

async function uploadToImgBB(file){

    let formData = new FormData();
    formData.append("image", file);

    let response = await fetch(
        `https://api.imgbb.com/1/upload?key=${imgbbAPI}`,
        {
            method: "POST",
            body: formData
        }
    );

    let data = await response.json();

    return data.data.url;
}

async function checkout() {

    let nama = document.getElementById("nama").value;
    let alamat = document.getElementById("alamat").value;
    let pay = document.getElementById("payment").value;
    let catatan = document.getElementById("catatan").value;
    let buktiBayar = document.getElementById("bukti_bayar").files[0];

    if (cart.length === 0) {
        alert("Keranjang kosong!");
        return;
    }

    if (!nama || !alamat) {
        alert("Mohon isi nama dan alamat terlebih dahulu!");
        return;
    }

    if ((pay === "qris" || pay === "bca") && !buktiBayar) {
        alert("Mohon upload bukti pembayaran!");
        return;
    }

    let buktiLink = "";

    // Upload ke ImgBB
    if(pay === "qris" || pay === "bca"){

        alert("Mengupload bukti pembayaran...");

        try{

            buktiLink = await uploadToImgBB(buktiBayar);

        }catch(error){

            alert("Upload gambar gagal!");
            return;
        }
    }

    let text = "Halo Dua Arah Coffee,%0A%0APesanan:%0A";

    cart.forEach(i => {
        text += `- ${i.name} x${i.qty}%0A`;
    });

    text += `%0ANama: ${nama}`;
    text += `%0AAlamat: ${alamat}`;
    text += `%0APembayaran: ${pay.toUpperCase()}`;

    if (catatan.trim() !== "") {
        text += `%0ACatatan: ${catatan}`;
    }

    // Link bukti pembayaran
    if(buktiLink !== ""){
        text += `%0A%0ABukti Pembayaran:%0A${buktiLink}`;
    }

    window.open(
        "https://wa.me/6288210129982?text=" + text,
        "_blank"
    );
}

</script>
