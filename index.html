<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dua Arah Coffee</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
scroll-behavior:smooth;
}

body{
background:#f7f3ee;
color:#2b1e16;
}

/* NAVBAR */
nav{
position:fixed;
top:0;
width:100%;
display:flex;
justify-content:space-between;
padding:20px 40px;
background:rgba(255,255,255,0.8);
backdrop-filter:blur(10px);
z-index:1000;
}

nav h1{
font-size:18px;
letter-spacing:3px;
}

nav a{
margin-left:20px;
text-decoration:none;
color:#2b1e16;
font-size:14px;
}

/* HERO */
.hero{
height:100vh;
background:url('coffee-bg.jpg') center/cover;
display:flex;
align-items:center;
justify-content:center;
position:relative;
color:white;
text-align:center;
}

.hero::before{
content:"";
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.4);
}

.hero-content{
position:relative;
z-index:2;
}

.hero h2{
font-size:48px;
letter-spacing:4px;
}

.hero p{
margin-top:10px;
opacity:0.8;
}

.btn{
margin-top:20px;
padding:12px 25px;
background:white;
border:none;
border-radius:30px;
cursor:pointer;
}

/* SECTION */
section{
padding:80px 40px;
max-width:1100px;
margin:auto;
}

/* MENU */
.menu-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-top:30px;
}

.card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 10px 20px rgba(0,0,0,0.05);
}

.card img{
width:100%;
height:200px;
object-fit:cover;
}

.card-content{
padding:15px;
}

.price{
color:#8c6a50;
font-weight:bold;
margin-top:5px;
}

/* ORDER */
.order{
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 10px 20px rgba(0,0,0,0.05);
}

input,select,textarea{
width:100%;
padding:10px;
margin-top:10px;
border-radius:8px;
border:1px solid #ddd;
}

button{
width:100%;
margin-top:15px;
padding:12px;
border:none;
border-radius:8px;
background:#4a3525;
color:white;
cursor:pointer;
}

/* FOOTER */
footer{
text-align:center;
padding:40px;
background:#2b1e16;
color:white;
margin-top:40px;
}

</style>
</head>

<body>

<!-- NAV -->
<nav>
<h1>DUA ARAH</h1>
<div>
<a href="#menu">Menu</a>
<a href="#order">Order</a>
</div>
</nav>

<!-- HERO -->
<div class="hero">

<div class="hero-content">

<h2>DUA ARAH COFFEE</h2>
<p>Kopi untuk setiap arah perjalananmu</p>

<button class="btn" onclick="document.getElementById('menu').scrollIntoView()">
Explore Menu
</button>

</div>

</div>

<!-- MENU -->
<section id="menu">

<h2>Our Menu</h2>

<div class="menu-grid">

<div class="card">
<img src="americano.jpg">
<div class="card-content">
<h3>Americano</h3>
<p class="price">Rp 12.500</p>
</div>
</div>

<div class="card">
<img src="aren.jpg">
<div class="card-content">
<h3>Kopi Aren</h3>
<p class="price">Rp 17.500</p>
</div>
</div>

</div>

</section>

<!-- ORDER -->
<section id="order">

<h2>Order Now</h2>

<div class="order">

<input id="nama" placeholder="Nama">
<input id="hp" placeholder="No HP">

<select id="menu">
<option>Americano</option>
<option>Kopi Aren</option>
</select>

<input id="qty" type="number" value="1">

<textarea id="alamat" placeholder="Alamat"></textarea>

<select id="pay">
<option>QRIS</option>
<option>BCA</option>
<option>Cash</option>
</select>

<button onclick="order()">Pesan Sekarang</button>

</div>

</section>

<footer>
© 2026 Dua Arah Coffee
</footer>

<script>

function order(){

let nama=document.getElementById('nama').value;
let hp=document.getElementById('hp').value;
let menu=document.getElementById('menu').value;
let qty=document.getElementById('qty').value;
let alamat=document.getElementById('alamat').value;
let pay=document.getElementById('pay').value;

let wa="6288210129982";

let text=
`Halo Dua Arah Coffee

Nama: ${nama}
HP: ${hp}

Pesanan:
${menu} x${qty}

Alamat:
${alamat}

Pembayaran: ${pay}

Terima kasih`;

window.open("https://wa.me/"+wa+"?text="+encodeURIComponent(text));

}

</script>

</body>
</html>
