<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dua Arah Coffee</title>

<style>
:root{
--primary:#4A3525;
--accent:#8C6A50;
--bg:#FAF6F0;
}

body{
margin:0;
font-family:Arial;
background:var(--bg);
}

header{
background:var(--primary);
color:white;
padding:20px;
text-align:center;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

/* MENU */
.menu-card{
display:flex;
gap:15px;
align-items:center;
background:white;
padding:15px;
margin-bottom:15px;
border-radius:10px;
}

.menu-card img{
width:70px;
height:70px;
border-radius:10px;
object-fit:cover;
}

.btn{
background:var(--accent);
color:white;
border:none;
padding:8px 12px;
border-radius:8px;
cursor:pointer;
}

/* CART */
.cart{
background:white;
padding:15px;
border-radius:10px;
margin-top:20px;
}

/* INPUT */
input,select{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:10px;
border-radius:8px;
border:1px solid #ccc;
}

/* MODAL */
.modal{
display:none;
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.7);
justify-content:center;
align-items:center;
}

.modal-content{
background:white;
padding:20px;
border-radius:10px;
text-align:center;
max-width:300px;
}

.modal img{
width:100%;
border-radius:10px;
}

.close{
color:red;
cursor:pointer;
font-weight:bold;
display:block;
margin-top:10px;
}

.checkout{
width:100%;
padding:12px;
background:green;
color:white;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
}
</style>
</head>

<body>

<header>
<h2>☕ Dua Arah Coffee</h2>
</header>

<div class="container">

<h3>Menu</h3>

<div class="menu-card">
<img src="americano.jpg">
<div>
<b>Americano</b><br>Rp 12.500
</div>
<button class="btn" onclick="add('Americano',12500)">+</button>
</div>

<div class="menu-card">
<img src="aren.jpg">
<div>
<b>Kopi Aren</b><br>Rp 17.500
</div>
<button class="btn" onclick="add('Kopi Aren',17500)">+</button>
</div>

<h3>Keranjang</h3>
<div class="cart" id="cart">Kosong</div>

<h3>Data Pemesan</h3>
<input id="nama" placeholder="Nama">
<input id="alamat" placeholder="Alamat">

<h3>Pembayaran</h3>
<select id="payment" onchange="cekBayar()">
<option value="cash">Cash</option>
<option value="qris">QRIS</option>
<option value="bca">Transfer BCA</option>
</select>

<button class="checkout" onclick="checkout()">Checkout WhatsApp</button>

</div>

<!-- MODAL QRIS / BCA -->
<div class="modal" id="modal">
<div class="modal-content">
<h3 id="title"></h3>
<img id="img">
<span class="close" onclick="closeModal()">Tutup</span>
</div>
</div>

<script>

let cart=[];

function add(name,price){
cart.push({name,price});
render();
}

function render(){
let html="";
let total=0;

if(cart.length===0){
document.getElementById("cart").innerHTML="Kosong";
return;
}

cart.forEach((item,i)=>{
html+=`
${item.name} - Rp ${item.price}<br>
`;
total+=item.price;
});

html+=`<hr><b>Total: Rp ${total}</b>`;
document.getElementById("cart").innerHTML=html;
}

function cekBayar(){
let val=document.getElementById("payment").value;

if(val==="qris"){
openModal("QRIS Payment","qris.jpg");
}

if(val==="bca"){
openModal("Transfer BCA","bca.jpg");
}
}

function openModal(title,img){
document.getElementById("title").innerText=title;
document.getElementById("img").src=img;
document.getElementById("modal").style.display="flex";
}

function closeModal(){
document.getElementById("modal").style.display="none";
}

function checkout(){

let nama=document.getElementById("nama").value;
let alamat=document.getElementById("alamat").value;
let pay=document.getElementById("payment").value;

if(cart.length===0){
alert("Keranjang kosong!");
return;
}

let text="Halo Dua Arah Coffee,%0A%0APesanan:%0A";

cart.forEach(i=>{
text+=`- ${i.name}%0A`;
});

text+=`%0ANama: ${nama}%0AAlamat: ${alamat}%0APembayaran: ${pay}`;

window.open("https://wa.me/6288210129982?text="+text);
}

</script>

</body>
</html>
